# Roland P-6 cheatsheet data.
# Source: Roland P-6 Owner's Manual (firmware 1.02 era). Page numbers refer to that PDF.
#
# Conventions:
#   "SHIFT + X"      hold SHIFT, press X
#   "X → Y"          press X, then Y
#   Step buttons are named by their keyboard note, with the printed function in
#   parentheses, e.g. "C# (ENTER)". Sharps are written "#" (the manual prints ´).
#   Display codes are written as they read on the 4-digit 7-segment display.
#   Several codes for one entry are separated by " / " (a code itself may contain spaces).

