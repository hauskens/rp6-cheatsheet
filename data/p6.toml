# ───────────────────────────── panel: common ─────────────────────────────

[[entry]]
section = "p-common"
id = "display"
short = "DISPLAY"
name = "Display"
summary = "Four-digit, seven-segment LED display. Shows the tempo on the top screen."
notes = [
  "A dot in the lower right means the current pattern has unsaved edits. It disappears after WRITE.",
  "Letters are approximated on 7 segments, e.g. 'm' looks like a three-legged n and 'W' like a reversed u.",
]
page = 5

[[entry]]
section = "p-common"
id = "tempo"
short = "TEMPO/VALUE"
name = "TEMPO/VALUE knob"
summary = "Changes the value shown on the display: the tempo on the top screen, or the selected parameter/value inside menus."
values = [
  ["Turn", "Tempo 40.0–300.0 (top screen), or select a parameter or value in menus"],
  ["SHIFT + turn", "Fine tempo in 0.1 steps; in menus, larger jumps for sample-time values"],
  ["PATTERN + turn", "Pattern Scale (step length)"],
  ["KYBD + turn", "Master probability, -100–100 (not saved)"],
  ["MFX + turn", "Select the MFX effect"],
]
page = 5

[[entry]]
section = "p-common"
id = "shift"
short = "SHIFT"
name = "SHIFT button"
summary = "Hold it with other controls to reach their secondary functions (labels printed under the buttons)."
notes = ["While in sampling mode, holding SHIFT shows the input peak level."]
page = 5

[[entry]]
section = "p-common"
id = "pattern"
short = "PATTERN"
name = "PATTERN button"
summary = "Switches to pattern selection mode, where the step buttons choose the pattern (1–16). Also a modifier for many shortcuts."
values = [
  ["Press", "Enter/exit pattern selection mode"],
  ["Hold + step 1–4", "Select pattern bank 1–4"],
  ["SHIFT + PATTERN", "Step loop mode (button blinks)"],
]
page = 5

[[entry]]
section = "p-common"
id = "play"
short = "PLAY"
name = "▶ (PLAY / COPY) button"
summary = "Plays the current pattern. Press again to stop. Its secondary function is COPY."
values = [
  ["Press", "Start/stop pattern playback"],
  ["SHIFT + ▶", "COPY menu: Ptn / dUPL / PArt"],
  ["Hold pad + SHIFT + ▶", "Copy or swap a sample (COPY / EXCG)"],
  ["Hold ▶ at power-on", "Pattern backup mass-storage mode"],
]
page = 5

[[entry]]
section = "p-common"
id = "rec"
short = "REC"
name = "● (REC / QUANTIZE) button"
summary = "Puts the pattern into record standby for real-time input; press ▶ to start recording. When stopped, it enters step edit ('St.' + step number)."
values = [
  ["Press", "Record standby (then ▶ to record), or step edit mode when not playing"],
  ["SHIFT + ●", "Toggle REC quantize (On/OFF)"],
  ["PATTERN + ●", "Toggle metronome (m.OFF / m.PLY)"],
  ["Hold pad + ●", "Toggle Play Quantize for that pad"],
  ["Hold ● at power-on", "Pattern restore mass-storage mode"],
]
page = 5

