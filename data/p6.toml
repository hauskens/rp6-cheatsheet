name = "Export / import samples"
controls = ["bank", "sampling", "power", "kybd"]
steps = [
  "Export: hold the bank buttons (+ SAMPLING for E–H) + power on → EXPORT/BANK_x/PAD_n.",
  "Import: hold SAMPLING + power on → put WAV (+ PRM) in IMPORT/BANK_x/PAD_n → eject → KYBD → 'donE'.",
]
notes = ["Import: up to 96 kHz, 8/16/24/32-bit. Over-length data is truncated."]
page = 83

[[entry]]
section = "h-data"
name = "Factory reset"
controls = ["kybd", "power", "granular"]
steps = ["Back up first!", "Hold KYBD + power on ('FACt').", "Press GRANULAR. Power-cycle after 'donE'."]
notes = ["Factory samples are not restored. Download them from roland.com."]
page = 88

